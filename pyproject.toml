[project]
name = "alpaca-dashboard"
version = "0.1.0"
description = "Reusable, read-only Alpaca paper account dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dash>=4.4.1,<5",
    "dash-ag-grid>=35.3,<36",
    "plotly>=7.1,<8",
    "exchange-calendars>=4.12,<5",
]

[project.scripts]
alpaca-dashboard = "alpaca_dashboard.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alpaca_dashboard"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
browser = ["playwright>=1.58,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
